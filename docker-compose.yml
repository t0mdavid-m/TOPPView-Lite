services:
  toppview-lite:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: toppview-lite
    container_name: toppview-lite
    restart: always
    ports:
      - 8501:8501
      # The sync service below shares this container's network, so its port
      # is published here: on loopback only, for the host's TLS proxy to route
      # /sync to. Plain HTTP would carry sync tokens and files in the clear.
      - 127.0.0.1:8502:8502
    volumes:
      - workspaces-toppview-lite:/workspaces-streamlit-template
      # Optional: bind-mount a host directory of MS data files at the path
      # that `local_data_dir` in settings.json points to (the Docker image
      # defaults this to /mounted-data). When the directory exists at
      # runtime, the upload page shows an in-app file browser for it.
      # - /path/on/host:/mounted-data:ro
    environment:
      # Number of Streamlit server instances (default: 1 = no load balancer).
      # Set to >1 to enable nginx load balancing across multiple Streamlit instances.
      - STREAMLIT_SERVER_COUNT=10
volumes:
  workspaces-toppview-lite:
