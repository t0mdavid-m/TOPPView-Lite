# App spec: what this app is. Schema and checker come from the template
# (utils/app_spec.schema.json, `python -m utils.app_spec`); the weekly
# template-sync job reads `template:` and `sync.app_owned` from here.
# App-owned: template syncs never overwrite this file.
spec_version: 1
template:
  repository: OpenMS/streamlit-template
  branch: main
app:
  slug: toppview-lite
  name: TOPPView-Lite
  description: 'Browser viewer for mzML and identification results: peak maps, spectra and chromatograms.'
  repository: t0mdavid-m/TOPPView-Lite
  domain: visualization
results:
- role: peakmap
  page: content/viewer.py
- role: spectrum
  page: content/viewer.py
pages:
- content/welcome.py
- content/upload.py
- content/viewer.py
deploy:
  k8s:
    enabled: false
  docker_compose: true
  desktop:
  - windows
  online_deployment: false

# Optional CI checks, all on by default. An app with few CI minutes turns off
# what it does not need (and sets deploy.desktop: [] to skip desktop builds).
# ci:
#   kind_tests: false             # kind deployments behind nginx and Traefik
#   apptainer: false              # Apptainer test and SIF
#   example_workflow_tests: false # workflow-tests.yml (template example)
#   openms_release: false         # PRs for new OpenMS releases

sync:
  app_owned:
  - app.yaml
  - app.py
  - settings.json
  - default-parameters.json
  - presets.json
  - parameter-names.json
  - README.md
  - content/*
  - src/python-tools/*
  - example-data/*
  - assets/*
  - k8s/overlays/*
  - src/components/*
  - src/integration/*
  - src/preprocessing/*
  - k8s/argocd/*
  - CLAUDE.app.md
  - conda-requirements.txt
  - contributors.json
  - dependency-licenses.json
