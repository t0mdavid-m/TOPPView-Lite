apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/memory-tier-low   # pod sizes only; overridden below for this app

namePrefix: toppview-lite-

commonLabels:
  app: toppview-lite

images:
  - name: openms-streamlit
    newName: ghcr.io/t0mdavid-m/toppview-lite
    newTag: main-full

patches:
  - target:
      kind: IngressRoute
      name: streamlit-traefik
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: (Host(`toppview-lite.webapps.openms.de`) || Host(`toppview-lite.webapps.openms.org`)) && PathPrefix(`/`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: toppview-lite-streamlit
      - op: replace
        path: /spec/routes/1/match
        value: (Host(`toppview-lite.webapps.openms.de`) || Host(`toppview-lite.webapps.openms.org`)) && PathPrefix(`/sync`)
      - op: replace
        path: /spec/routes/1/services/0/name
        value: toppview-lite-sync
  - target:
      kind: Deployment
      name: streamlit
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://toppview-lite-redis:6379/0"
  # TOPPView-Lite parses mzML/idXML inside the Streamlit process (Upload page,
  # MzMLFile().load into memory), not on the RQ queue. The Streamlit pod
  # therefore needs the memory headroom, and the workers do not: they get a
  # small Guaranteed size instead of the tier's 16Gi each.
  - target:
      kind: Deployment
      name: streamlit
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "16Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
  - target:
      kind: Deployment
      name: sync
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://toppview-lite-redis:6379/0"
  - target:
      kind: Deployment
      name: rq-worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://toppview-lite-redis:6379/0"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "2Gi"
            cpu: "1"
